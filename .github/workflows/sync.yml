name: Auto Sync

on:
  push:
    branches: [main, v2-development]
  pull_request:
    branches: [main, v2-development]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Sync status
        run: echo "Repository synced successfully ✅"